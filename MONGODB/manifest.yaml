apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: suraj
  labels:
    app: mongodb
    tier: db
    project: roboshop
spec:
  selector:
    matchLabels:
      app: mongodb
      tier: db
      project: roboshop
  serviceName: "mongodb"
  replicas: 3
  template:
    metadata:
      labels:
        app: mongodb
        tier: db
        project: roboshop
    spec:
      containers:
      - name: mongodb
        image: 751510979323.dkr.ecr.us-east-1.amazonaws.com/suraj/dev/mongodb:latest
        livenessProbe:
          exec:
            command:
              - /bin/bash
              - -c
              - mongo --eval 'db.adminCommand({ ping: 1 })'
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: mongodb
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongodb
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "ebs-sc" # Ensure this StorageClass exists in your cluster
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: suraj
spec:
  clusterIP: None #headless
  selector:
    app: mongodb
    tier: db
    project: roboshop
  ports:
  - name: mongodb-port
    protocol: TCP
    port: 27017 # Port on which the service is exposed within the cluster
    targetPort: 27017 # Port the container is listening on